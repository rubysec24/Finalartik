  <script type="text/javascript">
    // İl tıklama işleyicisi
    function handleProvinceClick(id, name, dealerCount, region) {
      // Tıklanan ilin bilgilerini ana sayfaya gönder
      window.parent.postMessage({
        type: 'cityClick',
        id: id,
        name: name,
        dealerCount: dealerCount || 0,
        region: region || ''
      }, '*');
    }

    // Ana sayfadan gelen mesajları dinle
    window.addEventListener('message', function(event) {
      if (event.data &amp;&amp; event.data.type === 'selectProvince') {
        // Önce tüm illerin sınıflarından selected'ı kaldır
        document.querySelectorAll('.province.selected').forEach(function(el) {
          el.classList.remove('selected');
        });
        
        // Seçilen ili vurgula
        if (event.data.id) {
          var selectedProvince = document.getElementById(event.data.id);
          if (selectedProvince) {
            selectedProvince.classList.add('selected');
          }
        }
      }
    });

    // SVG yüklendiğinde varsayılan vurgulamaları yap
    document.addEventListener('DOMContentLoaded', function() {
      // Burada başlangıçta bir ili vurgulamak isterseniz:
      // var defaultProvince = document.getElementById('34'); // İstanbul
      // if (defaultProvince) defaultProvince.classList.add('selected');
      
      // İllerin hover ve tıklama olaylarını güncelle
      document.querySelectorAll('.province').forEach(function(province) {
        province.addEventListener('mouseover', function() {
          this.style.fill = '#4299e1';
        });
        
        province.addEventListener('mouseout', function() {
          if (!this.classList.contains('selected')) {
            this.style.fill = '#e0e0e0';
          }
        });
      });
    });
  </script>
</svg> 