  <style>
    .province {
      fill: #e0e0e0;
      stroke: #ffffff;
      stroke-width: 0.5;
      transition: fill 0.3s ease;
    }
    .province:hover {
      fill: #4299e1;
      cursor: pointer;
    }
    .selected {
      fill: #3182ce;
    }
    .province-label {
      font-family: Arial, sans-serif;
      font-size: 8px;
      fill: #333;
      pointer-events: none;
    }
  </style>
  
